<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eff3fa">
  <title>動画リアクションプレイヤー</title>
  <style>
    :root {
      font-family: "UD デジタル 教科書体 NK-R", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", system-ui, sans-serif;
      color: #202b43; background: #101724;
      font-synthesis: none; -webkit-tap-highlight-color: transparent;
    }
    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { min-width: 320px; overscroll-behavior: none; }
    button, input { font: inherit; }
    button { touch-action: manipulation; cursor: pointer; }
    button:disabled { opacity: .40; cursor: not-allowed; }
    button:focus-visible, input:focus-visible, .tap-surface:focus-visible {
      outline: 3px solid #8fb6ff; outline-offset: 2px;
    }
    /* 画面全体を動画とコンパクトな操作バーだけに使用する */
    .app {
      width: 100%; height: 100vh; height: 100dvh;
      padding: max(5px, env(safe-area-inset-top))
               max(6px, env(safe-area-inset-right))
               max(5px, env(safe-area-inset-bottom))
               max(6px, env(safe-area-inset-left));
      display: flex; flex-direction: column; gap: 6px; overflow: hidden;
    }
    .file-input { display: none; }
    .stage {
      position: relative; flex: 1 1 0; min-height: 0; width: 100%;
      background: #0c1424; border: 1px solid #253148; border-radius: 9px;
      overflow: hidden; isolation: isolate;
    }
    .stage video {
      width: 100%; height: 100%; position: absolute; inset: 0;
      display: block; object-fit: contain; background: #0c1424;
    }
    .stage::before {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse at 50% 60%, #1c3050 0%, #0c1424 65%);
    }
    .stage.has-video::before { display: none; }
    .empty-state {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      padding: 12px; color: #fff; gap: 12px;
    }
    .empty-icon {
      width: 68px; height: 68px; display: grid; place-items: center;
      color: #becdf1; background: #ffffff14; border: 1px solid #ffffff20;
      border-radius: 18px;
    }
    .empty-icon svg { width: 34px; height: 34px; }
    .empty-state h2 { font-size: clamp(17px, 2.4vw, 24px); margin: 0; }
    .empty-choose {
      min-height: 42px; border: 0; border-radius: 10px;
      background: #fff; color: #2549aa; padding: 8px 20px;
      font-weight: 800; font-size: 15px;
    }
    .tap-surface {
      position: absolute; z-index: 2; display: none;
      touch-action: manipulation; cursor: crosshair;
      overflow: hidden; user-select: none; -webkit-user-select: none;
    }
    .has-video .tap-surface { display: block; }
    .reaction-stamp {
      position: absolute; transform: translate(-50%, -50%); pointer-events: none;
      z-index: 3; width: max-content; max-width: 230px;
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      will-change: opacity, transform;
      animation: stamp-fly 1500ms cubic-bezier(.16,.85,.3,1) forwards;
      filter: drop-shadow(0 5px 9px #0007);
    }
    .stamp-icon {
      display: grid; place-items: center; width: 65px; height: 65px;
      font-size: 39px; border-radius: 50%; border: 3px solid white;
      background: #dbeaff;
    }
    .stamp-word {
      display: block; padding: 5px 12px 6px; border: 2px solid #fff;
      border-radius: 100px; font-size: 18px; font-weight: 900;
      line-height: 1.2; white-space: nowrap; background: #2679e5;
      color: white; letter-spacing: .03em;
    }
    .reaction-stamp.cheer .stamp-icon { background: #fff0c4; }
    .reaction-stamp.cheer .stamp-word { background: #ef841c; }
    /* 未達成の箇所を示すしょんぼり顔にはキラキラを付けない */
    .reaction-stamp.cheer::before, .reaction-stamp.cheer::after { display: none; }
    .reaction-stamp::before, .reaction-stamp::after {
      content: "✦"; position: absolute; font-size: 29px; color: #ffdc68;
      top: 2px; left: -25px; animation: twinkle 700ms ease-out both;
    }
    .reaction-stamp::after { top: 11px; left: auto; right: -22px; font-size: 23px; animation-delay: 120ms; }
    @keyframes stamp-fly {
      0% { opacity: 0; translate: 0 18px; scale: .3; rotate: -13deg; }
      14% { opacity: 1; translate: 0 0; scale: 1.16; rotate: 5deg; }
      28% { scale: 1; rotate: 0deg; }
      68% { opacity: 1; translate: 0 -7px; scale: 1; }
      100% { opacity: 0; translate: 0 -48px; scale: .83; }
    }
    @keyframes twinkle {
      from { opacity: 0; transform: scale(.2) rotate(-30deg); }
      to { opacity: 1; transform: scale(1.2) rotate(20deg); }
    }
    /* ボタン類は常に動画直下の1行にまとめる */
    .player-controls {
      flex: none; width: 100%; min-height: 55px; display: flex;
      align-items: center; flex-wrap: nowrap; gap: 8px;
      padding: 6px 9px; background: #fff; border-radius: 10px;
    }
    .upload-button, .play-btn, .sound-btn, .reaction-btn {
      min-height: 40px; height: 40px; border-radius: 9px; flex: none;
      display: inline-flex; align-items: center; justify-content: center;
      white-space: nowrap; font-weight: 800;
    }
    .upload-button {
      gap: 5px; padding: 0 9px; background: #eef2f8; border: 1px solid #d8e0ee;
      color: #253758; font-size: 13px;
    }
    .upload-button svg { width: 17px; height: 17px; }
    .upload-short { display: none; }
    .play-btn { width: 43px; padding: 0; background: #3159d8; color: white; border: 0; }
    .play-btn svg { width: 22px; height: 22px; fill: currentColor; }
    .seek-group {
      min-width: 45px; flex: 1 1 200px; display: flex;
      flex-direction: column; justify-content: center; gap: 2px;
    }
    .control-label {
      display: flex; justify-content: flex-end; font-size: 11px;
      font-weight: 750; color: #63738f;
    }
    .time { white-space: nowrap; font-variant-numeric: tabular-nums; }
    input[type="range"] {
      width: 100%; min-height: 18px; margin: 0; accent-color: #345ddb;
      touch-action: pan-x; cursor: pointer;
    }
    input[type="range"]:disabled { cursor: not-allowed; }
    .reaction-btn {
      padding: 0 9px; gap: 4px; font-size: 13px;
      border: 2px solid transparent;
      transition: background .12s, border-color .12s, transform .12s;
    }
    .reaction-btn:active { transform: scale(.96); }
    .reaction-btn .icon-emoji { font-family: system-ui, sans-serif; font-size: 21px; }
    .reaction-btn.like { background: #eaf3ff; border-color: #eaf3ff; color: #1d66bd; }
    .reaction-btn.cheer { background: #fff3df; border-color: #fff3df; color: #ac5d0c; }
    .reaction-btn.like.selected { border-color: #2b77e3; background: #dceaff; box-shadow: inset 0 0 0 1px white; }
    .reaction-btn.cheer.selected { border-color: #e38a1f; background: #ffebc7; box-shadow: inset 0 0 0 1px white; }
    .sound-btn {
      width: 40px; padding: 0; background: #f2f5fa;
      border: 1px solid #e5ebf4; color: #334967;
    }
    .sound-btn svg { width: 21px; height: 21px; stroke: currentColor;
      fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    /* エラーだけは動画上に一時メッセージとして表示（高さを取らない） */
    .status-line { position: absolute; z-index: 5; bottom: 12px; left: 50%;
      transform: translateX(-50%); max-width: 92%; pointer-events: none;
      display: none; padding: 9px 13px; border-radius: 9px;
      color: #fff; background: #9d371ff0; font-size: 13px;
      text-align: center; font-weight: 700;
    }
    .status-line.warning { display: block; }
    .status-dot { display: none; }
    /* iPadの横向きからスマートフォンまで1列を維持 */
    @media (max-width: 760px) {
      .app { gap: 4px; }
      .player-controls { gap: 5px; padding: 5px 6px; min-height: 49px; }
      .upload-button, .play-btn, .sound-btn, .reaction-btn { min-height: 36px; height: 36px; border-radius: 7px; }
      .upload-button { padding: 0 6px; font-size: 12px; }
      .upload-button svg { width: 16px; height: 16px; }
      .upload-long { display: none; }
      .upload-short { display: inline; }
      .play-btn, .sound-btn { width: 37px; }
      .reaction-btn { font-size: 11px; padding: 0 5px; gap: 2px; }
      .reaction-btn .icon-emoji { font-size: 18px; }
      .control-label { font-size: 10px; }
      .seek-group { min-width: 35px; }
      .stamp-icon { width: 53px; height: 53px; font-size: 32px; }
      .stamp-word { font-size: 15px; }
    }
    @media (max-width: 480px) {
      .reaction-btn { width: 38px; padding: 0; }
      .reaction-btn .icon-emoji { font-size: 20px; }
      .reaction-label { display: none; }
    }
    @media (max-width: 370px) {
      .player-controls { gap: 3px; padding: 4px; }
      .reaction-btn { padding: 0 3px; font-size: 10px; }
      .reaction-btn .icon-emoji { font-size: 17px; }
      .upload-button { padding: 0 4px; }
      .play-btn, .sound-btn { width: 34px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .reaction-stamp { animation: stamp-fade 1150ms linear forwards; }
      .reaction-stamp::before, .reaction-stamp::after { animation: none; }
      @keyframes stamp-fade { 0% {opacity: 0;} 12% {opacity: 1;} 75% {opacity: 1;} 100% {opacity: 0;} }
    }
  </style>
</head>
<body>
  <main class="app">
    <input class="file-input" id="fileInput" type="file" accept="video/*,.mp4,.m4v,.mov,.webm" aria-label="端末内の動画ファイルを選択">

    <section class="stage" id="stage" aria-label="動画の表示エリア">
      <video id="video" playsinline webkit-playsinline preload="metadata" disablepictureinpicture controlslist="nodownload noremoteplayback" aria-label="選択した動画"></video>
      <div id="tapSurface" class="tap-surface" aria-label="選んだリアクションを置く場所"></div>
      <div id="status" class="status-line" role="status" aria-live="polite">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="statusText">動画を選んでから、再生できます。</span>
      </div>
      <div id="emptyState" class="empty-state">
        <div class="empty-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><rect x="2" y="4" width="20" height="16" rx="4" stroke="currentColor" stroke-width="1.7"/><path d="m10 8 6 4-6 4V8Z" fill="currentColor"/></svg>
        </div>
        <h2>動画を読み込んでください</h2>
        <button type="button" id="emptyChoose" class="empty-choose">動画を選ぶ</button>
      </div>
    </section>

    <section class="player-controls" aria-label="再生コントロール">
      <button type="button" class="upload-button" id="changeVideo" aria-label="動画を選ぶ・変更">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V3m0 0L7 8m5-5 5 5M5 17v3h14v-3"/></svg>
        <span class="upload-long">動画を選ぶ・変更</span><span class="upload-short">動画</span>
      </button>
      <button type="button" class="play-btn" id="playBtn" disabled aria-label="再生">
        <svg id="playIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 4 13 8-13 8V4Z"/></svg>
        <svg id="pauseIcon" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg>
      </button>
      <div class="seek-group">
        <div class="control-label">
          <span class="time"><span id="currentTime">0:00</span> / <span id="duration">0:00</span></span>
        </div>
        <input type="range" id="seek" min="0" max="1000" step="1" value="0" disabled aria-label="再生位置">
      </div>
      <div class="reaction-picks" role="group" aria-label="表示するマーク" style="display:contents">
        <button type="button" id="likeBtn" class="reaction-btn like" aria-label="イイね！" title="イイね！" aria-pressed="false">
          <span class="icon-emoji" aria-hidden="true">👍</span><span class="reaction-label">イイね！</span>
        </button>
        <button type="button" id="cheerBtn" class="reaction-btn cheer" aria-label="がんばろう！" title="がんばろう！" aria-pressed="false">
          <span class="icon-emoji" aria-hidden="true">😞</span><span class="reaction-label">がんばろう！</span>
        </button>
      </div>
      <button type="button" id="soundBtn" class="sound-btn" aria-label="音を消す" disabled>
        <svg id="soundOn" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Zm5 3a5 5 0 0 1 0 8m2-11a9 9 0 0 1 0 14"/></svg>
        <svg id="soundOff" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M11 5 6 9H3v6h3l5 4V5Zm5 4 6 6m0-6-6 6"/></svg>
      </button>
    </section>
  </main>

  <script>
    (() => {
      'use strict';

      // 完全ローカル読み込み。fetch / XMLHttpRequest / アップロードは使用しません。
      const $ = id => document.getElementById(id);
      const video = $('video');
      const fileInput = $('fileInput');
      const stage = $('stage');
      const tapSurface = $('tapSurface');
      const emptyState = $('emptyState');
      const playBtn = $('playBtn');
      const playIcon = $('playIcon');
      const pauseIcon = $('pauseIcon');
      const soundBtn = $('soundBtn');
      const soundOn = $('soundOn');
      const soundOff = $('soundOff');
      const seek = $('seek');
      const likeBtn = $('likeBtn');
      const cheerBtn = $('cheerBtn');
      const status = $('status');
      const statusText = $('statusText');

      let objectUrl = null;
      let currentReaction = null;
      let loaded = false;

      const chooseVideo = () => fileInput.click();
      $('changeVideo').addEventListener('click', chooseVideo);
      $('emptyChoose').addEventListener('click', chooseVideo);

      function setStatus(message, state = '') {
        statusText.textContent = message;
        status.classList.toggle('active', state === 'active');
        status.classList.toggle('warning', state === 'warning');
      }

      function timeString(seconds) {
        if (!Number.isFinite(seconds) || seconds < 0) return '0:00';
        const n = Math.floor(seconds);
        const min = Math.floor(n / 60);
        const sec = String(n % 60).padStart(2, '0');
        return min >= 60 ? `${Math.floor(min / 60)}:${String(min % 60).padStart(2, '0')}:${sec}` : `${min}:${sec}`;
      }

      function updateTimeline() {
        const duration = Number.isFinite(video.duration) ? video.duration : 0;
        $('currentTime').textContent = timeString(video.currentTime);
        $('duration').textContent = timeString(duration);
        seek.value = duration > 0 ? String(Math.round(video.currentTime / duration * 1000)) : '0';
      }

      function updatePlayback() {
        const isPlaying = loaded && !video.paused && !video.ended;
        playIcon.hidden = isPlaying;
        pauseIcon.hidden = !isPlaying;
        playBtn.setAttribute('aria-label', isPlaying ? '一時停止' : '再生');
      }

      function updateSound() {
        soundOn.hidden = video.muted;
        soundOff.hidden = !video.muted;
        soundBtn.setAttribute('aria-label', video.muted ? '音を出す' : '音を消す');
      }

      function fitTapArea() {
        if (!loaded || !video.videoWidth || !video.videoHeight) return;
        const w = stage.clientWidth;
        const h = stage.clientHeight;
        const scale = Math.min(w / video.videoWidth, h / video.videoHeight);
        const imageWidth = video.videoWidth * scale;
        const imageHeight = video.videoHeight * scale;
        tapSurface.style.left = `${(w - imageWidth) / 2}px`;
        tapSurface.style.top = `${(h - imageHeight) / 2}px`;
        tapSurface.style.width = `${imageWidth}px`;
        tapSurface.style.height = `${imageHeight}px`;
      }

      function clearStamps() { tapSurface.replaceChildren(); }

      function loadVideo(file) {
        if (!file) return;
        const isVideo = file.type.startsWith('video/') || /\.(mp4|m4v|mov|webm|ogv|ogg)$/i.test(file.name);
        if (!isVideo) { setStatus('動画ファイルを選んでください。', 'warning'); return; }

        // 前の動画のオブジェクトURLを解放。どちらの動画もアップロードしません。
        video.pause();
        video.removeAttribute('src');
        video.load();
        if (objectUrl) URL.revokeObjectURL(objectUrl);
        objectUrl = URL.createObjectURL(file);
        loaded = false;
        clearStamps();
        stage.classList.remove('has-video');
        emptyState.hidden = true;
        seek.value = 0;
        playBtn.disabled = true;
        seek.disabled = true;
        soundBtn.disabled = true;
        updateTimeline();
        updatePlayback();
        setStatus('動画を読み込んでいます…');
        video.src = objectUrl;
        video.load();
      }

      fileInput.addEventListener('change', () => {
        const file = fileInput.files && fileInput.files[0];
        if (file) loadVideo(file);
        fileInput.value = ''; // 同じ動画を選び直せるようにする
      });

      video.addEventListener('loadedmetadata', () => {
        loaded = true;
        stage.classList.add('has-video');
        playBtn.disabled = false;
        soundBtn.disabled = false;
        seek.disabled = !Number.isFinite(video.duration) || video.duration <= 0;
        fitTapArea();
        updateTimeline();
        updatePlayback();
        setStatus('動画を読み込みました。再生ボタンで再生できます。', 'active');
      });

      video.addEventListener('error', () => {
        if (!objectUrl) return;
        loaded = false;
        stage.classList.remove('has-video');
        emptyState.hidden = false;
        playBtn.disabled = true;
        seek.disabled = true;
        soundBtn.disabled = true;
        updatePlayback();
        setStatus('この動画形式はブラウザで再生できません。MP4形式などをお試しください。', 'warning');
      });

      async function togglePlayback() {
        if (!loaded) return;
        if (!video.paused && !video.ended) { video.pause(); return; }
        try { await video.play(); }
        catch (error) { setStatus('再生できませんでした。対応する動画形式か確認してください。', 'warning'); }
      }
      playBtn.addEventListener('click', togglePlayback);
      video.addEventListener('play', updatePlayback);
      video.addEventListener('pause', updatePlayback);
      video.addEventListener('ended', updatePlayback);
      video.addEventListener('timeupdate', updateTimeline);
      video.addEventListener('durationchange', () => {
        seek.disabled = !loaded || !Number.isFinite(video.duration) || video.duration <= 0;
        updateTimeline();
      });
      seek.addEventListener('input', () => {
        if (loaded && Number.isFinite(video.duration) && video.duration > 0)
          video.currentTime = (Number(seek.value) / 1000) * video.duration;
      });
      soundBtn.addEventListener('click', () => { video.muted = !video.muted; updateSound(); });
      video.addEventListener('volumechange', updateSound);

      function selectReaction(type) {
        currentReaction = currentReaction === type ? null : type;
        const likeSelected = currentReaction === 'like';
        const cheerSelected = currentReaction === 'cheer';
        likeBtn.classList.toggle('selected', likeSelected);
        cheerBtn.classList.toggle('selected', cheerSelected);
        likeBtn.setAttribute('aria-pressed', String(likeSelected));
        cheerBtn.setAttribute('aria-pressed', String(cheerSelected));
        if (!currentReaction) setStatus('マークは未選択です。ボタンを押すと選べます。');
        else setStatus(`${likeSelected ? 'イイね！' : 'がんばろう！'}を選択中。動画の好きな場所をタップしてください。`, 'active');
      }
      likeBtn.addEventListener('click', () => selectReaction('like'));
      cheerBtn.addEventListener('click', () => selectReaction('cheer'));

      function addStamp(x, y) {
        const stamp = document.createElement('div');
        stamp.className = `reaction-stamp ${currentReaction}`;
        stamp.style.left = `${x}px`;
        stamp.style.top = `${y}px`;
        const icon = document.createElement('span');
        icon.className = 'stamp-icon';
        icon.textContent = currentReaction === 'like' ? '👍' : '😞';
        const word = document.createElement('span');
        word.className = 'stamp-word';
        word.textContent = currentReaction === 'like' ? 'イイね！' : 'がんばろう！';
        stamp.append(icon, word);
        tapSurface.append(stamp);
        stamp.addEventListener('animationend', () => stamp.remove(), { once: true });
        // 万一アニメーションイベントが発火しない環境でも残さない
        setTimeout(() => stamp.remove(), 1850);
      }
      tapSurface.addEventListener('pointerdown', event => {
        if (!loaded || (event.pointerType === 'mouse' && event.button !== 0)) return;
        event.preventDefault();
        if (!currentReaction) {
          setStatus('先に「イイね！」か「がんばろう！」を選んでください。', 'warning');
          return;
        }
        const rect = tapSurface.getBoundingClientRect();
        // タップした位置を基準に表示（画面端では少しだけ内側に寄せる）
        const marginX = Math.min(65, rect.width / 2);
        const marginY = Math.min(65, rect.height / 2);
        const x = Math.min(Math.max(event.clientX - rect.left, marginX), rect.width - marginX);
        const y = Math.min(Math.max(event.clientY - rect.top, marginY), rect.height - marginY);
        addStamp(x, y);
      });

      if (typeof ResizeObserver !== 'undefined') new ResizeObserver(fitTapArea).observe(stage);
      window.addEventListener('resize', fitTapArea);
      window.addEventListener('pagehide', () => {
        video.pause();
        if (objectUrl) URL.revokeObjectURL(objectUrl);
      });
    })();
  </script>
</body>
</html>
